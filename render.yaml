# Render Blueprint -- deploys all 3 of this project's own services as
# free web services. Connect this repo in Render as "New > Blueprint"
# and it reads this file automatically.
#
# What this does NOT provision (both need a separate free account,
# Render doesn't offer either):
#   - MySQL (app data)      -> TiDB Cloud Starter free tier
#   - Postgres (n8n's own workflow/credential storage) -> Neon free tier
# See DEPLOYMENT.md for the full step-by-step, including exactly which
# values go into the "sync: false" secrets below (Render will prompt for
# these in its dashboard after you apply this blueprint -- they are
# deliberately NOT filled in here so no secret ever needs to be
# committed to this repo).

services:
  # ------------------------------------------------------------------
  # The Streamlit app itself (Data Merge Engine, Voice Intake, Data
  # Quality Report, Scale Readiness Plan, Skill Automation, Settings).
  # ------------------------------------------------------------------
  - type: web
    name: nexora-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # enableCORS/enableXsrfProtection off: Streamlit's browser client opens a
    # websocket back to the server, and behind a reverse proxy (Render's) both
    # of those checks see the proxy's origin rather than the browser's and
    # reject the upgrade -- the page then sits on its loading spinner forever
    # with no error. Safe here: the app's own login gate is what protects it,
    # not these two same-origin heuristics.
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      # Render defaults to the newest Python it offers (3.14 at time of
      # writing). Python 3.13 removed the audioop stdlib module (PEP 594),
      # which pydub imports -- so the app died on startup with
      # "No module named 'pyaudioop'". 3.12 is the newest release that
      # still ships audioop. Also kept in .python-version so the pin is
      # visible in the repo, not only in this file.
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MYSQL_HOST
        sync: false
      # TiDB Cloud serves MySQL on 4000, not MySQL's usual 3306. Hardcoded
      # (not sync: false) so a blueprint sync can't silently reset it -- but
      # change it here, not just in the dashboard, if the provider changes.
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: N8N_BASE_URL
        value: https://nexora-n8n.onrender.com

  # ------------------------------------------------------------------
  # The Flask API n8n's Task 2 workflow calls (GET /api/people,
  # PATCH /api/people/<id>/skill_category). Gated by API_KEY -- every
  # /api/* request must send a matching X-API-Key header once this is
  # set (see automation/api_server.py).
  # ------------------------------------------------------------------
  - type: web
    name: nexora-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 automation/api_server.py
    envVars:
      # Render defaults to the newest Python it offers (3.14 at time of
      # writing). Python 3.13 removed the audioop stdlib module (PEP 594),
      # which pydub imports -- so the app died on startup with
      # "No module named 'pyaudioop'". 3.12 is the newest release that
      # still ships audioop. Also kept in .python-version so the pin is
      # visible in the repo, not only in this file.
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MYSQL_HOST
        sync: false
      # TiDB Cloud serves MySQL on 4000, not MySQL's usual 3306. Hardcoded
      # (not sync: false) so a blueprint sync can't silently reset it -- but
      # change it here, not just in the dashboard, if the provider changes.
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: API_KEY
        generateValue: true

  # ------------------------------------------------------------------
  # n8n itself, running the official Docker image. DB_TYPE=postgresdb
  # points its own internal storage (workflows/credentials/execution
  # history) at an external free Postgres (Neon) instead of local
  # SQLite -- Render's free web services don't reliably keep a local
  # disk across redeploys, so SQLite storage would be wiped.
  #
  # n8n's own login (its "owner account" setup screen on first visit)
  # is what actually gates the editor -- complete that immediately
  # after this first deploys, before sharing the URL with anyone.
  # ------------------------------------------------------------------
  - type: web
    name: nexora-n8n
    runtime: image
    plan: free
    image:
      url: docker.io/n8nio/n8n:latest
    # Render already runs dockerCommand through a shell, so wrapping it in
    # another `sh -c "..."` collapsed the quoting and made the whole string
    # be treated as one command name ("... n8n start: not found", exit 127).
    # Plain command here; the N8N_* settings that command used to inline are
    # ordinary envVars below instead.
    dockerCommand: n8n start
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_PORT
        value: "10000"  # Render's default $PORT for web services
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        value: nexora-n8n.onrender.com
      - key: N8N_WEBHOOK_URL          # WEBHOOK_URL is deprecated in favour of this
        value: https://nexora-n8n.onrender.com/

      # --- Fitting n8n into a 512MB free instance -------------------------
      # It didn't, out of the box: "FATAL ERROR: Ineffective mark-compacts
      # near heap limit - JavaScript heap out of memory", then a restart
      # loop and 502s from Render's proxy. Capping V8's heap below the
      # container limit makes it collect garbage aggressively instead of
      # growing until the OOM killer steps in; the rest of these switch off
      # subsystems this deployment has no use for. 512MB is genuinely tight
      # for n8n, so treat this as making it *fit*, not as headroom.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      # The internal Python task runner already failed to start ("Python 3 is
      # missing from this system") and nothing here uses Code-node Python.
      - key: N8N_RUNNERS_ENABLED
        value: "false"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"
      # Execution history is the other thing that grows without bound. Keep
      # it (it's how you show the workflow actually ran) but prune it.
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"   # hours == 1 week
      - key: EXECUTIONS_DATA_PRUNE_MAX_COUNT
        value: "50"

      - key: DB_TYPE
        value: postgresdb
      # Neon's free tier suspends an idle database, and waking it takes long
      # enough that n8n's default ping gave up ("Database ping failed (1/3):
      # Database connection timed out"). A small pool also means fewer live
      # sockets to hold open on a memory-starved instance.
      - key: DB_POSTGRESDB_POOL_SIZE
        value: "2"
      - key: DB_POSTGRESDB_CONNECTION_TIMEOUT
        value: "60000"
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        sync: false
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      # Neon rejects non-SSL connections ("connection is insecure, try using
      # sslmode=require"). n8n's SSL_ENABLED defaults to false and is only
      # auto-enabled by the SSL_CA/CERT/KEY vars -- REJECT_UNAUTHORIZED alone
      # does not turn SSL on, so it has to be set explicitly. No custom CA
      # needed: Neon's certificate chains to a publicly trusted root.
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "true"
